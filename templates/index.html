<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-3xl mx-auto p-4">
    <header class="mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Support Agent</h1>
      <p class="text-gray-500 text-sm">Describe your issue and I'll create a support ticket</p>
    </header>

    <div id="messages" class="space-y-4 mb-4"></div>
    <div id="empty-state" class="text-center py-16 text-gray-400">
      <p class="text-lg">Describe your issue to get started</p>
      <p class="text-sm mt-1">Try: "My app keeps crashing when I try to export a report"</p>
    </div>

    <form id="chat-form" class="flex gap-2">
      <input id="message-input" class="flex-1 rounded-lg border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Describe your issue..." autocomplete="off" />
      <button type="submit" class="bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50">Send</button>
    </form>

    <div id="confirm-bar" class="hidden mt-4 p-4 bg-yellow-50 rounded-lg border text-center">
      <p class="text-sm text-gray-700 mb-2">Shall I create this ticket?</p>
      <button id="btn-yes" class="bg-green-600 text-white px-4 py-2 rounded mr-2 hover:bg-green-700">Yes, create it</button>
      <button id="btn-no" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">No, let me change it</button>
    </div>
  </div>

  <script>
    const SID = "sess_" + Date.now();
    const messagesEl = document.getElementById("messages");
    const emptyEl = document.getElementById("empty-state");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message-input");
    const confirmBar = document.getElementById("confirm-bar");
    let currentStage = "collecting";

    function addMessage(role, content) {
      emptyEl?.remove();
      const div = document.createElement("div");
      div.className = role === "user" ? "text-right" : "text-left";
      div.innerHTML = `<div class="inline-block rounded-lg px-4 py-3 max-w-[80%] ${role === "user" ? "bg-blue-600 text-white" : "bg-white border border-gray-200 text-gray-800"}"><p class="text-sm whitespace-pre-wrap">${content}</p></div>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage("user", message);
      input.value = "";
      input.disabled = true;
      form.querySelector("button").disabled = true;
      confirmBar.classList.add("hidden");
      try {
        const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: SID, message }) });
        const data = await res.json();
        addMessage("assistant", data.reply);
        currentStage = data.stage;
        if (data.stage === "confirming") confirmBar.classList.remove("hidden");
      } catch { addMessage("assistant", "Sorry, something went wrong."); } finally {
        input.disabled = false;
        form.querySelector("button").disabled = false;
        input.focus();
      }
    });

    document.getElementById("btn-yes").addEventListener("click", async () => {
      confirmBar.classList.add("hidden");
      try {
        const res = await fetch("/api/chat", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: SID, confirmed: true }) });
        const data = await res.json();
        addMessage("assistant", data.reply);
      } catch { addMessage("assistant", "Failed to create ticket."); }
    });

    document.getElementById("btn-no").addEventListener("click", async () => {
      confirmBar.classList.add("hidden");
      try {
        const res = await fetch("/api/chat", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: SID, confirmed: false }) });
        const data = await res.json();
        addMessage("assistant", data.reply);
      } catch { addMessage("assistant", "Failed to cancel."); }
    });
  </script>
</body>
</html>
